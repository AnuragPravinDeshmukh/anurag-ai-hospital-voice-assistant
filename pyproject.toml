[project]
name = "anurag-ai-hospital-voice-agent"
version = "2.1.0"
description = "Anurag AI Hospital — Multilingual AI Voice Assistant for hospital appointment booking and patient queries"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Anurag Deshmukh" },
    { name = "Srinath S (Original Author)", url = "https://github.com/SrinathS-21/Sarvam-Voice-Agent" }
]
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    # Twilio
    "twilio>=9.0.0",
    # Database
    "pymongo>=4.6.0",
    "motor>=3.3.2", # Async MongoDB driver
    # Vector database
    "pinecone>=5.0.0",
    # HTTP requests
    "requests>=2.31.0",
    # Environment management
    "python-dotenv>=1.0.0",
    # NLP and embeddings
    "sentence-transformers>=2.2.0",
    # Async support for future streaming
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    # Utilities
    "numpy>=1.24.3",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.20",
    "sarvamai>=0.1.22",
    "apscheduler>=3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modules"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning"
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
